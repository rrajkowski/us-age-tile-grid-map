name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages must be enabled once in the repo UI (Settings → Pages → GitHub Actions).
# Do not use configure-pages enablement: true here — GITHUB_TOKEN cannot create
# the Pages site ("Resource not accessible by integration"). After the site exists,
# this workflow uploads the artifact and deploy-pages publishes it.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html census-data.js states_age_1970_2025.json .nojekyll _site/
          cp -R vendor _site/vendor

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
